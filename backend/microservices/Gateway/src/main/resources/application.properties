spring.application.name=api-gateway
server.port=8092

# Eureka client
eureka.client.service-url.defaultZone=http://admin:123456@localhost:8761/eureka/

# Actuator (pour /actuator/gateway/routes)
management.endpoints.web.exposure.include=gateway
management.endpoint.gateway.enabled=true

# Logs (question 2.b et 3)
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG
logging.level.org.springframework.cloud.loadbalancer=DEBUG

# ---- Routes de documentation OpenAPI (index 0 et 1) ----
spring.cloud.gateway.routes[0].id=candidat-docs
spring.cloud.gateway.routes[0].uri=lb://candidat
spring.cloud.gateway.routes[0].predicates[0]=Path=/candidat/v3/api-docs
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/candidat/v3/api-docs, /v3/api-docs

spring.cloud.gateway.routes[1].id=job-docs
spring.cloud.gateway.routes[1].uri=lb://job
spring.cloud.gateway.routes[1].predicates[0]=Path=/job/v3/api-docs
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/job/v3/api-docs, /v3/api-docs

# ---- Routes métier via Eureka (index 2 et 3) ----
spring.cloud.gateway.routes[2].id=CANDIDAT
spring.cloud.gateway.routes[2].uri=lb://candidat
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/candidates/**,/api/addresses/**

spring.cloud.gateway.routes[3].id=JOB
spring.cloud.gateway.routes[3].uri=lb://job
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/jobs/**,/api/categories/**

# ---- Portail Swagger unifié ----
springdoc.swagger-ui.urls[0].name=Candidat
springdoc.swagger-ui.urls[0].url=/candidat/v3/api-docs
springdoc.swagger-ui.urls[1].name=Job
springdoc.swagger-ui.urls[1].url=/job/v3/api-docs